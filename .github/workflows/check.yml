# Every push: the tests, the type check, and a search of the whole history for anything that looks like a
# credential. No meeting data is in the repository, so none of this ever sees any.
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      # the screen indexer's frame tests pick frames from a real recording; under CI they fail without FFmpeg
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: npm run typecheck
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
  installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test "ops/**/*.test.mjs"
